
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instagram Login Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0c1014;
            color: white;
        }

        .main {
            display: grid;
            grid-template-columns: 50% 50%;
            min-height: 100vh;
        }

        .left {
            padding: 30px;
            border-right: 1px solid #3a3f45;
        }

        #logo {
            width: 55px;
            height: 55px;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            font-size: 30px;
            line-height: 2;
            margin: 0 0 20px;
            font-weight: 500;
        }

        h1 span {
            background: linear-gradient(
                90deg,
                #ff7a59,
                #ff3d9a,
                #c13fe0
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #image {
            width: 250px;
            max-width: 100%;
        }

        .right {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        form {
            width: 100%;
            max-width: 420px;
        }

        h3 {
            font-size: 17px;
            font-weight: 500;
        }

        .input {
            display: block;
            width: 100%;
            padding: 22px 16px;
            border-radius: 18px;
            margin: 12px 0;
            border: 1px solid #5b6168;
            background: transparent;
            color: white;
            font-size: 14px;
        }

        .input::placeholder {
            color: #aaa;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            text-align: center;
            margin: 12px 0;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        #login {
            background: #3a6df0;
            color: white;
            margin-top: 20px;
        }

        .for {
            text-decoration: none;
            color: white;
            text-align: center;
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin: 25px 0 50px;
        }

        #fb {
            background: #2d3238;
            color: white;
        }

        #create {
            background: transparent;
            color: #4aa3ff;
            border: 1px solid #3a6df0;
        }

        .meta {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #ccc;
        }

        .demo {
            font-size: 11px;
            color: #aaa;
            text-align: center;
        }

        @media (max-width: 700px) {
            .main {
                grid-template-columns: 1fr;
            }

            .left {
                border-right: none;
            }

            .right {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="main">

    <section class="left">

        <svg id="logo" viewBox="0 0 48 48">

            <defs>
                <linearGradient
                    id="g"
                    x1="0"
                    y1="1"
                    x2="1"
                    y2="0"
                >
                    <stop offset="0" stop-color="#fdb92d"/>
                    <stop offset="0.5" stop-color="#e1306c"/>
                    <stop offset="1" stop-color="#833ab4"/>
                </linearGradient>
            </defs>

            <rect
                x="3"
                y="3"
                width="42"
                height="42"
                rx="12"
                fill="none"
                stroke="url(#g)"
                stroke-width="4"
            />

            <circle
                cx="24"
                cy="24"
                r="9"
                fill="none"
                stroke="url(#g)"
                stroke-width="4"
            />

            <circle
                cx="35"
                cy="13"
                r="2.5"
                fill="url(#g)"
            />

        </svg>

        <div class="content">

            <h1>
                See everyday moments from
                <br>
                your <span>close friends.</span>
            </h1>

            <img
                src="instagram-image.png"
                alt="Instagram illustration"
                id="image"
            >

        </div>

    </section>

    <section class="right">

        <form onsubmit="return false;">

            <h3>Log into Instagram</h3>

            <p class="demo">
                CLASS PROJECT DEMO — DO NOT ENTER REAL ACCOUNT DETAILS
            </p>

            <input
                type="text"
                placeholder="Mobile number, username or email"
                class="input"
                autocomplete="off"
            >

            <input
                type="password"
                placeholder="Demo password"
                class="input"
                autocomplete="off"
            >

            <button type="button" class="btn" id="login">
                Log in
            </button>

            <a href="#" class="for">
                Forgot password?
            </a>

            <button type="button" class="btn" id="fb">
                Log in with Facebook
            </button>

            <button type="button" class="btn" id="create">
                Create new account
            </button>

        </form>

        <div class="meta">&infin; Meta</div>

    </section>

</div>

</body>
</html>
